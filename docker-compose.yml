version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: srm_postgres
    environment:
      POSTGRES_DB: claims_db
      POSTGRES_USER: claims_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims_user -d claims_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: srm_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: srm_chromadb
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: srm_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # CPU only — no GPU config
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: srm_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://claims_user:${POSTGRES_PASSWORD}@postgres:5432/claims_db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: srm_celery
    command: celery -A workers.tasks worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql://claims_user:${POSTGRES_PASSWORD}@postgres:5432/claims_db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      PYTHONPATH: /app
      # Exchange SSL — для корп. CA
      CURL_CA_BUNDLE: ""
      REQUESTS_CA_BUNDLE: ""
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: srm_celery_beat
    command: celery -A workers.tasks beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://claims_user:${POSTGRES_PASSWORD}@postgres:5432/claims_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  telegram_bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: srm_telegram
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_data:
